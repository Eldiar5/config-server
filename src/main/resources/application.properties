spring.application.name=config-server
server.port=8888

# --- Config backend ---
# Default (Docker): Git backend, configs are read from the agora-config repository.
# Profile "local": native backend, configs are read from ../config-repo (see application-local.properties).
spring.profiles.group.local=native

spring.cloud.config.server.git.uri=${CONFIG_GIT_URI:https://github.com/Eldiar5/agora-config}
spring.cloud.config.server.git.default-label=${CONFIG_GIT_LABEL:dev}
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.force-pull=true

# Eureka
eureka.client.serviceUrl.defaultZone=http://eureka-server:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
