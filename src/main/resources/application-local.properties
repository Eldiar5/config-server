spring.application.name=config-server
server.port=8888

# Path to config-repo: CONFIG_REPO_PATH env var, or ../config-repo relative to the working directory
spring.cloud.config.server.native.search-locations=${CONFIG_REPO_PATH:file:../config-repo/}

# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=http://localhost:${server.port}
